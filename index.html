<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171A">
<title>Kerbside</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Martian+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --asphalt:#14171A;
  --kerb:#1E2328;
  --kerb-hi:#272D34;
  --meter:#FFB020;
  --fare:#7FD1AE;
  --paper:#E8E6DF;
  --ink:#101316;
  --dim:#7A858F;
  --line:#2C333A;
  --warn:#E8825A;

  --mono:"Martian Mono",ui-monospace,"Courier New",monospace;
  --sans:"Instrument Sans",system-ui,-apple-system,sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--asphalt);
  color:#E6EAEE;
  font-family:var(--sans);
  font-size:16px;
  line-height:1.45;
  padding:0 0 96px;
  min-height:100vh;
  overscroll-behavior-y:contain;
}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}

/* ---------- masthead ---------- */
.mast{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:20px 0 14px;border-bottom:1px solid var(--line);
}
.mast h1{
  font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.14em;
  margin:0;text-transform:uppercase;
}
.mast h1 span{color:var(--meter)}
.ctx{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.08em;text-align:right}

/* ---------- sections ---------- */
.sec{margin:26px 0 0}
.sec > h2{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);margin:0 0 10px;font-weight:500;
}

/* ---------- route ---------- */
.route{display:grid;gap:8px}
.field{position:relative;display:flex;align-items:center;background:var(--kerb);border:1px solid var(--line);border-radius:3px}
.field label{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--dim);
  padding:0 10px 0 12px;flex:0 0 auto;text-transform:uppercase;
}
.field input{
  flex:1;min-width:0;background:none;border:0;color:#E6EAEE;
  font-family:var(--sans);font-size:15.5px;padding:13px 8px 13px 0;
}
.field input::placeholder{color:#57626B}
.field input:focus{outline:none}
.field:focus-within{border-color:var(--meter)}
.copybtn{
  flex:0 0 auto;background:none;border:0;border-left:1px solid var(--line);
  color:var(--dim);font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
  padding:14px 12px;cursor:pointer;align-self:stretch;
}
.copybtn:active{color:var(--meter)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{
  background:var(--kerb);border:1px solid var(--line);color:#AEB8C0;
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  padding:7px 11px;border-radius:2px;cursor:pointer;
}
.chip:active{border-color:var(--meter);color:var(--meter)}
.chip.add{color:var(--dim);border-style:dashed}

/* ---------- swap control ---------- */
.cond{display:flex;gap:8px;margin-top:10px}
.toggle{
  flex:1;background:var(--kerb);border:1px solid var(--line);border-radius:3px;
  padding:11px 8px;text-align:center;cursor:pointer;
  font-family:var(--mono);font-size:10px;letter-spacing:.07em;color:var(--dim);
}
.toggle:active{border-color:var(--meter);color:var(--meter)}

/* ---------- the stack: the launcher ---------- */
.stack{display:grid;gap:7px}
.slab{
  display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:12px;
  background:var(--kerb);border:1px solid var(--line);border-radius:3px;
  padding:15px 14px;cursor:pointer;text-align:left;width:100%;
  color:inherit;font:inherit;position:relative;overflow:hidden;
}
.slab:focus-visible{outline:2px solid var(--meter);outline-offset:2px}
.slab .rank{
  font-family:var(--mono);font-size:14px;font-weight:700;color:var(--dim);
}
.slab .nm{font-size:16px;font-weight:600;letter-spacing:-.01em}
.slab .go{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.08em}
.slab.unset{opacity:.55}
.slab.unset .go{color:var(--warn)}

/* ---------- setup ---------- */
.row{
  display:flex;justify-content:space-between;gap:12px;align-items:baseline;
  padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;
}
.row .l{min-width:0}
.row .meta{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-top:2px;letter-spacing:.05em}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setrow{padding:13px 0;border-bottom:1px solid var(--line)}
.setrow .sh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.setrow .nm2{font-size:15px;font-weight:600}
.badge{font-family:var(--mono);font-size:9px;letter-spacing:.07em;padding:3px 7px;border-radius:2px}
.badge.ok{color:var(--fare);border:1px solid rgba(127,209,174,.4)}
.badge.no{color:var(--warn);border:1px solid rgba(232,130,90,.4)}
.pkgin{
  width:100%;margin-top:9px;background:var(--kerb);border:1px solid var(--line);
  border-radius:2px;padding:11px;color:#E6EAEE;font-family:var(--mono);font-size:12px;
}
.pkgin:focus{outline:none;border-color:var(--meter)}
.mini{font-size:12px;color:var(--dim);margin-top:7px;line-height:1.45}
.ghost{
  background:none;border:1px solid var(--line);color:#AEB8C0;border-radius:2px;
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:11px 13px;cursor:pointer;
}
.ghost:active{border-color:var(--meter);color:var(--meter)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

/* ---------- tab bar ---------- */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:rgba(20,23,26,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);
}
.tabs button{
  flex:1;background:none;border:0;padding:14px 4px 15px;cursor:pointer;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;
}
.tabs button[aria-selected="true"]{color:var(--meter);box-shadow:inset 0 2px 0 var(--meter)}
.view{display:none}
.view.on{display:block}

.toast{
  position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(8px);
  background:var(--paper);color:var(--ink);padding:11px 18px;border-radius:3px;
  font-family:var(--mono);font-size:11px;letter-spacing:.05em;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;
  max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <div class="mast">
    <h1>Kerb<span>side</span></h1>
    <div class="ctx" id="ctx"></div>
  </div>

  <!-- ================= RIDE ================= -->
  <div class="view on" id="v-ride">
    <div class="sec">
      <h2>Route</h2>
      <div class="route">
        <div class="field">
          <label for="from">From</label>
          <input id="from" placeholder="Pickup" autocomplete="off">
          <button class="copybtn" data-copy="from">COPY</button>
        </div>
        <div class="field">
          <label for="to">To</label>
          <input id="to" placeholder="Destination" autocomplete="off">
          <button class="copybtn" data-copy="to">COPY</button>
        </div>
      </div>
      <div class="chips" id="chips"></div>
      <div class="cond">
        <button class="toggle" id="tSwap">SWAP ENDS</button>
      </div>
    </div>

    <div class="sec">
      <h2>Open an app</h2>
      <div class="stack" id="stack"></div>
      <div class="mini">Tapping copies your destination to the clipboard, then opens the app — paste it into the app’s destination field.</div>
    </div>
  </div>

  <!-- ================= SETUP ================= -->
  <div class="view" id="v-set">
    <div class="sec">
      <h2>App links</h2>
      <div class="mini" style="margin:0 0 14px" id="setIntro"></div>
      <div id="setList"></div>
    </div>
    <div class="sec">
      <h2>Saved places</h2>
      <div id="favList"></div>
      <div class="btnrow">
        <button class="ghost" id="addFav">ADD PLACE</button>
      </div>
    </div>
    <div class="sec">
      <h2>Backup</h2>
      <div class="mini" id="storeNote"></div>
      <div class="btnrow">
        <button class="ghost" id="expBtn">EXPORT SETTINGS</button>
        <button class="ghost" id="impBtn">IMPORT SETTINGS</button>
      </div>
    </div>
  </div>
</div>

<nav class="tabs">
  <button aria-selected="true" data-v="ride">Ride</button>
  <button aria-selected="false" data-v="set">Setup</button>
</nav>
<div class="toast" id="toast"></div>

<script>
/* ---------------- storage (falls back to memory if blocked) ---------------- */
var mem = {}, persistent = true;
try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); } catch(e){ persistent = false; }
function put(k,v){ var s = JSON.stringify(v); if(persistent){ try{ localStorage.setItem(k,s); return; }catch(e){ persistent=false; } } mem[k]=s; }
function get(k,d){ var s = persistent ? localStorage.getItem(k) : mem[k]; if(s==null) return d; try{ return JSON.parse(s); }catch(e){ return d; } }

/* ---------------- model ----------------
   Order is the user's own preference (TADA, Grab, CDG Zig, then the rest); it drives
   the launch list directly. Not a computed ranking — the fare log that used to produce
   one was removed. */
var APPS = [
  { id:'tada',  name:'TADA',    pkg:'',                       verified:false },
  { id:'grab',  name:'Grab',    pkg:'com.grabtaxi.passenger', verified:true  },
  { id:'zig',   name:'CDG Zig', pkg:'',                       verified:false },
  { id:'gojek', name:'Gojek',   pkg:'com.gojek.app',          verified:false },
  { id:'ryde',  name:'Ryde',    pkg:'',                       verified:false }
];
var pkgs  = get('ks.pkgs', {});
var favs  = get('ks.favs', ['Home','Office','Changi T1','Raffles Place']);
APPS.forEach(function(a){ if(pkgs[a.id]!==undefined) a.pkg = pkgs[a.id]; });

/* iOS launches by custom URL scheme (with an App Store link as fallback) instead of
   Android package intents. Prefilled schemes are unverified guesses; the Setup tab
   is the source of truth once tested on the device. */
var IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var IOS_DEFAULTS = {
  grab:  { scheme:'grab',  store:'https://apps.apple.com/sg/app/grab-taxi-ride-food-delivery/id647268330' },
  gojek: { scheme:'gojek', store:'https://apps.apple.com/sg/app/gojek/id944875099' },
  tada:  { store:'https://apps.apple.com/sg/app/tada-ride-hailing/id1412329684' },
  ryde:  { store:'https://apps.apple.com/sg/app/ryde-ride-hailing-more/id979806982' },
  zig:   { store:'https://apps.apple.com/sg/app/cdg-zig-taxis-cars/id954951647' }
};
var ios = get('ks.ios', {});
/* retire the experimental Grab booking deep links — device-tested Aug 2026, Grab
   ignored the address then failed to open at all. Strip any auto-prefilled copy so
   tapping reverts to the plain, reliable scheme. A template the user typed themselves
   (anything unrecognised) is left alone. */
var RETIRED_DL = {
  'grab://open?screenType=BOOKING&dropOffAddress={dest}':1,
  'grab://open?screenType=BOOKING&dropOffLatitude={lat}&dropOffLongitude={lng}&dropOffAddress={dest}':1
};
if(ios.grab && RETIRED_DL[ios.grab.dl]){ delete ios.grab.dl; put('ks.ios', ios); }
/* fill only fields the user has never touched — a cleared '' field stays cleared */
APPS.forEach(function(a){
  var d = IOS_DEFAULTS[a.id] || {}, c = ios[a.id] || (ios[a.id] = {});
  for(var k in d) if(c[k] === undefined) c[k] = d[k];
});
function linked(a){
  if(!IOS) return !!a.pkg;
  var c = ios[a.id] || {};
  return !!(c.scheme || c.store || c.dl);
}

/* ---------------- helpers ---------------- */
function norm(s){ return (s||'').trim().toLowerCase().replace(/\s+/g,' '); }
function band(d){
  var h = d.getHours(), we = (d.getDay()===0 || d.getDay()===6);
  if(h < 6) return 'Late night';
  if(we) return h < 18 ? 'Weekend day' : 'Weekend night';
  if(h < 9)  return 'AM peak';
  if(h < 12) return 'Morning';
  if(h < 17) return 'Midday';
  if(h < 20) return 'PM peak';
  return 'Evening';
}
function dayType(d){ var w = d.getDay(); return (w===0||w===6) ? 'Weekend' : 'Weekday'; }

/* ---------------- saved places (legacy entries are plain strings) ---------------- */
function favName(f){ return typeof f === 'string' ? f : f.name; }
function favByDest(dest){
  var d = norm(dest);
  for(var i=0;i<favs.length;i++) if(norm(favName(favs[i]))===d) return favs[i];
  return null;
}
/* OneMap search — free SG government geocoder, no token needed */
function geocode(q, cb){
  fetch('https://www.onemap.gov.sg/api/common/elastic/search?searchVal=' +
        encodeURIComponent(q) + '&returnGeom=Y&getAddrDetails=N&pageNum=1')
    .then(function(r){ return r.json(); })
    .then(function(d){
      var r0 = d.results && d.results[0];
      cb(r0 ? { lat:r0.LATITUDE, lng:r0.LONGITUDE, hit:r0.SEARCHVAL } : null);
    })
    .catch(function(){ cb(null); });
}
function addPlace(){
  var name = prompt('Name this place as you would type it into a ride app');
  if(!name || !name.trim()) return;
  name = name.trim();
  var addr = prompt('Address to pin it to (for deep links) — leave as-is if the name is already a real place', name);
  var f = { name:name };
  favs.push(f); put('ks.favs', favs); renderChips(); renderSetup();
  if(addr && addr.trim()){
    geocode(addr.trim(), function(g){
      if(g){
        f.addr = addr.trim(); f.lat = g.lat; f.lng = g.lng;
        put('ks.favs', favs); renderSetup();
        toast(name + ' pinned to ' + g.hit);
      } else {
        toast(name + ' saved without a pin — could not locate "' + addr.trim() + '"');
      }
    });
  }
}

/* ---------------- render ---------------- */
function renderCtx(){
  var d = new Date();
  document.getElementById('ctx').textContent =
    dayType(d).toUpperCase() + ' · ' + band(d).toUpperCase();
}

function renderStack(){
  var host = document.getElementById('stack'); host.innerHTML = '';
  /* keep the user's preferred order; only sink not-yet-linked apps to the bottom */
  var ordered = APPS.slice().sort(function(x,y){ return (linked(x)?0:1) - (linked(y)?0:1); });
  ordered.forEach(function(a,i){
    var b = document.createElement('button');
    b.className = 'slab' + (linked(a) ? '' : ' unset');
    b.innerHTML =
      '<div class="rank">' + (i+1) + '</div>' +
      '<div class="nm">' + a.name + '</div>' +
      '<div class="go">' + (linked(a) ? 'OPEN →' : 'SET UP') + '</div>';
    b.onclick = function(){ launch(a); };
    host.appendChild(b);
  });
}

function renderSetup(){
  document.getElementById('setIntro').textContent = IOS
    ? 'On iPhone, apps launch by URL scheme (e.g. "grab"). Schemes are not officially published, so test each by tapping OPEN once. Add the app’s App Store share link as a fallback: App Store page → share → Copy Link.'
    : 'To launch an app, this needs its Android package name. Open the app’s Play Store page, tap Share, copy the link and paste it below. The package is pulled out automatically.';
  var host = document.getElementById('setList'); host.innerHTML = '';
  APPS.forEach(function(a){
    var d = document.createElement('div'); d.className = 'setrow';
    var head =
      '<div class="sh"><div class="nm2">' + a.name + '</div>' +
      '<div class="badge ' + (linked(a) ? 'ok' : 'no') + '">' + (linked(a) ? 'LINKED' : 'NOT LINKED') + '</div></div>';
    if(IOS){
      var c = ios[a.id] || (ios[a.id] = {});
      d.innerHTML = head +
        '<input class="pkgin" data-k="scheme" placeholder="URL scheme, e.g. grab" value="' + (c.scheme||'') + '">' +
        '<input class="pkgin" data-k="store" placeholder="App Store link (fallback, optional)" value="' + (c.store||'') + '">' +
        '<input class="pkgin" data-k="dl" placeholder="Deep link template, {dest} = destination (advanced)" value="' + (c.dl||'') + '">' +
        '<div class="mini">Scheme untested until you tap OPEN and the app appears. A deep link template, when set and a destination is typed, is tried instead of the plain scheme — clear it if the app opens on the wrong screen.</div>';
      d.querySelectorAll('input').forEach(function(inp){
        inp.onchange = function(){
          var v = inp.value.trim();
          if(inp.dataset.k === 'scheme') v = v.replace(/:\/\/.*$/,'').replace(/\s/g,'');
          c[inp.dataset.k] = v; put('ks.ios', ios);
          inp.value = v; renderSetup(); renderStack();
          toast(linked(a) ? a.name + ' linked' : a.name + ' unlinked');
        };
      });
    } else {
      d.innerHTML = head +
        '<input class="pkgin" placeholder="Paste Play Store link or package name" value="' + (a.pkg||'') + '">' +
        (a.verified ? '' : '<div class="mini">Not confirmed by me. Paste the Play Store link to be certain.</div>');
      var inp = d.querySelector('input');
      inp.onchange = function(){
        var raw = inp.value.trim();
        var m = raw.match(/[?&]id=([\w.]+)/);
        var pkg = m ? m[1] : raw.replace(/\s/g,'');
        a.pkg = pkg; pkgs[a.id] = pkg; put('ks.pkgs', pkgs);
        inp.value = pkg; renderSetup(); renderStack();
        toast(pkg ? a.name + ' linked' : a.name + ' unlinked');
      };
    }
    host.appendChild(d);
  });

  var fl = document.getElementById('favList'); fl.innerHTML = '';
  favs.forEach(function(f,i){
    var row = document.createElement('div'); row.className = 'row';
    row.innerHTML = '<div class="l"><div class="trunc">' + favName(f) + '</div>' +
      '<div class="meta">' + (typeof f === 'object' && f.lat
        ? 'PINNED · ' + (f.addr || favName(f)).toUpperCase()
        : 'NO PIN — REMOVE AND RE-ADD WITH AN ADDRESS FOR DEEP LINKS') + '</div></div>';
    var b = document.createElement('button');
    b.className = 'ghost'; b.textContent = 'REMOVE'; b.style.padding = '6px 10px';
    b.onclick = function(){ favs.splice(i,1); put('ks.favs',favs); renderSetup(); renderChips(); };
    row.appendChild(b); fl.appendChild(row);
  });

  document.getElementById('storeNote').textContent = persistent
    ? 'Your app links and saved places live in this browser only. Export a backup before clearing Safari data or moving to a new phone.'
    : 'This browser is blocking storage, so your setup will reset on reload. Open the app through the home-screen icon rather than a private tab.';
}

function renderChips(){
  var host = document.getElementById('chips'); host.innerHTML = '';
  favs.forEach(function(f){
    var c = document.createElement('button'); c.className = 'chip'; c.textContent = favName(f);
    c.onclick = function(){
      var fr = document.getElementById('from'), to = document.getElementById('to');
      if(!fr.value) fr.value = favName(f); else to.value = favName(f);
    };
    host.appendChild(c);
  });
  var add = document.createElement('button');
  add.className = 'chip add'; add.textContent = '+ PLACE';
  add.onclick = addPlace;
  host.appendChild(add);
}

/* ---------------- launching ---------------- */
function launch(a){
  if(!linked(a)){ show('set'); toast('Link ' + a.name + ' first'); return; }
  var dest = document.getElementById('to').value.trim();
  if(dest && navigator.clipboard) navigator.clipboard.writeText(dest).catch(function(){});
  if(IOS){
    var c = ios[a.id] || {};
    /* deep link template beats plain scheme, but only when there is a destination;
       templates with {lat}/{lng} additionally need the destination to be a pinned place */
    var target = '';
    if(c.dl && dest){
      var f = favByDest(dest);
      if(c.dl.indexOf('{lat}') === -1 || (f && f.lat)){
        target = c.dl.replace('{dest}', encodeURIComponent(dest))
                     .replace('{lat}', f && f.lat ? f.lat : '')
                     .replace('{lng}', f && f.lng ? f.lng : '');
      }
    }
    if(!target && c.scheme) target = c.scheme + '://';
    if(target){
      if(c.store){
        /* App Store fallback, only if the app truly isn't there. When the scheme opens
           the app, iOS suspends this page's timers, so the callback fires much later
           than scheduled (or not at all) — if it fires roughly on time and we're still
           visible, the app didn't open. The elapsed-time guard stops a slow open or an
           "Open in ...?" prompt from wrongly bouncing to the App Store. */
        var DELAY = 2500, start = Date.now(), done = false;
        var cancel = function(){ done = true; };
        window.addEventListener('pagehide', cancel, { once:true });
        document.addEventListener('visibilitychange', function h(){
          if(document.hidden){ cancel(); document.removeEventListener('visibilitychange', h); }
        });
        setTimeout(function(){
          if(done || document.hidden) return;
          if(Date.now() - start > DELAY + 600) return; /* timer was suspended = app opened */
          window.location.href = c.store;
        }, DELAY);
      }
      window.location.href = target;
    } else {
      window.location.href = c.store;
    }
    return;
  }
  var store = 'https://play.google.com/store/apps/details?id=' + a.pkg;
  var url = 'intent://#Intent;package=' + a.pkg + ';S.browser_fallback_url=' + encodeURIComponent(store) + ';end';
  try { window.location.href = url; }
  catch(e){ window.open(store,'_blank'); }
}

/* ---------------- wiring ---------------- */
function toast(m){
  var t = document.getElementById('toast');
  t.textContent = m; t.classList.add('on');
  clearTimeout(t._x); t._x = setTimeout(function(){ t.classList.remove('on'); }, 1900);
}
function show(v){
  ['ride','set'].forEach(function(k){
    document.getElementById('v-'+k).classList.toggle('on', k===v);
  });
  document.querySelectorAll('.tabs button').forEach(function(b){
    b.setAttribute('aria-selected', b.dataset.v===v);
  });
  if(v==='set') renderSetup();
}
document.querySelectorAll('.tabs button').forEach(function(b){
  b.onclick = function(){ show(b.dataset.v); };
});
document.querySelectorAll('.copybtn').forEach(function(b){
  b.onclick = function(){
    var v = document.getElementById(b.dataset.copy).value.trim();
    if(!v) return;
    if(navigator.clipboard) navigator.clipboard.writeText(v).then(function(){ toast('Copied'); }).catch(function(){});
  };
});
document.getElementById('tSwap').onclick = function(){
  var f = document.getElementById('from'), t = document.getElementById('to');
  var tmp = f.value; f.value = t.value; t.value = tmp;
};
document.getElementById('expBtn').onclick = function(){
  var blob = new Blob([JSON.stringify({ favs:favs, pkgs:pkgs, ios:ios }, null, 2)], { type:'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'kerbside-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
};
document.getElementById('impBtn').onclick = function(){
  var i = document.createElement('input'); i.type = 'file'; i.accept = 'application/json';
  i.onchange = function(){
    var fr = new FileReader();
    fr.onload = function(){
      try {
        var d = JSON.parse(fr.result);
        if(d.favs)  { favs  = d.favs;  put('ks.favs', favs); }
        if(d.pkgs)  { pkgs  = d.pkgs;  put('ks.pkgs', pkgs);
                      APPS.forEach(function(a){ if(pkgs[a.id]!==undefined) a.pkg = pkgs[a.id]; }); }
        if(d.ios)   { ios   = d.ios;   put('ks.ios', ios); }
        renderChips(); renderStack(); renderSetup();
        toast('Settings imported');
      } catch(e){ toast('That file could not be read'); }
    };
    fr.readAsText(i.files[0]);
  };
  i.click();
};
document.getElementById('addFav').onclick = addPlace;

renderCtx(); renderChips(); renderStack();
setInterval(renderCtx, 60000);
</script>
